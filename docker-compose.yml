version: "3.9"

services:
  backend:
    build: ./backend
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-64-character-hex-string}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./phishguard.db}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    container_name: phishguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:

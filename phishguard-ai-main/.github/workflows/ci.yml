name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-random-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: docker build -t phishguard-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - run: docker build -t phishguard-frontend:ci .
